# ==============================================================================
# VPNGuard Captive Portal Temporary PF Anchor Rules
# Target: /etc/pf.anchors/vpnguard-captive
#
# Loaded ONLY during temporary Wi-Fi Captive Portal login (vpnguard pause).
# - GID 888 (vpnguard sandbox / browser): remains strictly isolated (loopback only).
# - GID 889 (vpnguard-proxy / xray): blocked from all egress.
# - GID 890 (vpnguard-tun / sing-box): blocked from all egress.
# - Normal user processes & macOS Captive Network Assistant: allowed to reach
#   the Wi-Fi captive portal until authorization completes or timer expires.
# ==============================================================================

# 1. GID 888 (Sandbox Client Jail): keep strictly isolated on loopback
pass quick on lo0 proto { tcp, udp } from { 127.0.0.0/8, ::1 } to { 127.0.0.0/8, ::1 } group 888 flags any keep state (if-bound)
block return out quick all group 888

# 2. GID 889 (vpnguard-proxy / Xray Daemon): block all egress
block drop out quick all group 889

# 3. GID 890 (vpnguard-tun / sing-box Daemon): block all egress
block drop out quick all group 890

# 4. Allow loopback and non-sandboxed traffic for Captive Portal login
pass quick on lo0 all flags any keep state
pass out quick all keep state
